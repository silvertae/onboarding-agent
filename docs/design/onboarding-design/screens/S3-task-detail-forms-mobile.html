<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S3 과제 상세 — 작성할 서식 (모바일)</title>
<link rel="stylesheet" href="../assets/ui.css">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#06479a}a:hover{color:#04336f}
.dl{width:44px;height:44px;border-radius:50%;border:1px solid #06479a;background:transparent;color:#06479a;display:grid;place-items:center;flex:none;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; background: #f5f5f7; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="background: #ffffff; border-bottom: 1px solid #e3e3e8; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <img src="../assets/blueward-symbol.png" alt="Blueward" style="width: 24px; height: 24px; border-radius: 4px">
    <b style="font-size: 15px; flex: 1">온보딩 에이전트</b>
    <span class="role">신입</span>
    <button class="icon-btn" type="button" aria-label="메뉴"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header>
  <div style="background: #fff7e8; color: #6b4500; font-size: 12px; padding: 6px 16px; border-bottom: 1px solid #f0d9a8">데모 환경 · 가상 데이터</div>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <a href="S2-me-mobile.html" class="row" style="gap: 6px; font-size: 14px; align-self: flex-start"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>타임라인으로</a>

    <section class="card" style="overflow: hidden">
      <div style="padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 12px">
        <div class="row" style="gap: 6px; flex-wrap: wrap"><span class="tag">첫 주</span><span class="own">회계팀</span><span class="st st-todo">할 일</span></div>
        <h1 style="font-size: 22px; line-height: 28px">법인카드 신청서 작성</h1>
        <div class="row" style="gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: #515154">
          <span class="row" style="gap: 6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>기한 11월 21일 (금)</span>
          <span>담당자 확인 필요</span>
        </div>
      </div>
      <hr class="sep">
      <div style="padding: 18px; display: flex; flex-direction: column; gap: 6px">
        <h3 style="font-size: 15px">안내</h3>
        <p class="secondary" style="font-size: 15px; line-height: 23px">법인카드 신청서를 작성해 회계 담당자에게 전달한 뒤 제출해 주세요.</p>
      </div>
      <hr class="sep">
      <div style="padding: 18px; display: flex; flex-direction: column; gap: 10px">
        <h3 style="font-size: 15px">작성할 서식</h3>
        <div class="files">
          <div class="file" style="padding: 10px 12px">
            <span class="file-ic"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h2M14 13h2M8 17h2M14 17h2"></path></svg></span>
            <div class="file-main">
              <span class="file-name" style="font-size: 14px"><span class="base">법인카드 신청서_회계팀 제출용(가상)</span><span class="ext">.xlsx</span></span>
              <span class="file-meta">Excel · 48KB</span>
            </div>
            <button class="dl" type="button" aria-label="법인카드 신청서_회계팀 제출용(가상).xlsx 내려받기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg></button>
          </div>
          <div class="file" style="padding: 10px 12px">
            <span class="file-ic"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M16 13H8M16 17H8M10 9H8"></path></svg></span>
            <div class="file-main">
              <span class="file-name" style="font-size: 14px"><span class="base">법인카드 사용 동의서</span><span class="ext">.docx</span></span>
              <span class="file-meta">Word · 32KB</span>
            </div>
            <button class="dl" type="button" aria-label="법인카드 사용 동의서.docx 내려받기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg></button>
          </div>
        </div>
      </div>
      <hr class="sep">
      <!-- 제출 영역은 기존 구현(flex-wrap) 그대로. 서식 기능으로 바뀌지 않는다. -->
      <div style="padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <button class="btn btn-outline btn-sm" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>이 과제에 대해 물어보기</button>
        <div class="row" style="gap: 8px; margin-left: auto"><span class="caption">제출하면 회계팀이 확인해요</span><button class="btn btn-primary" type="submit">제출</button></div>
      </div>
    </section>
  </main>
</div>

</body>
</html>
