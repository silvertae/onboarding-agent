<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S4 에이전트 채팅 모바일</title>
<link rel="stylesheet" href="../assets/ui.css">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-pressed)}
</style>

<div style="width: 390px; height: 844px; background: var(--surface-chat); display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #ffffff; border-bottom: 1px solid var(--border); padding: 10px 8px 10px 4px; display: flex; align-items: center; gap: 8px">
    <a href="S2-me-mobile.html" class="icon-btn" aria-label="닫기" style="width: 44px; height: 44px"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <span class="mascot s-36" aria-hidden="true"><span class="float"><span class="cube"><i class="limb foot l"></i><i class="limb foot r"></i><i class="limb arm l"></i><i class="limb arm r"></i><span class="face"><i class="eye l"></i><i class="eye r"></i></span></span></span></span>
    <div style="display: flex; flex-direction: column; flex: 1; line-height: 1.25"><b style="font-size: 15px">온보딩 에이전트</b><span class="caption">회사·AI팀 지식으로 답해요</span></div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <span class="caption" style="align-self: center">오늘</span>
    <div class="msg-u">회의실 예약 어떻게 해?</div>
    <div class="msg-a">
      <span class="bubble">사내 그룹웨어 › 자원 예약 › 회의실에서 예약해요. 7층 소회의실 A·B는 AI팀 우선이고, 2시간 넘게 쓰려면 총무팀 승인이 필요해요.</span>
      <div class="src"><span>근거</span><a href="#">회의실 이용 규칙 (회사 공통)</a></div>
    </div>
    <div class="msg-u">동호회 가입비 얼마야?</div>
    <div class="msg-a">
      <span class="bubble" style="background: var(--alert-warn-bg); border-color: var(--alert-warn-border); display: flex; gap: 8px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px; color: var(--alert-warn-fg)"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg><span>확인되지 않은 내용이에요.</span></span>
      <button class="btn btn-outline" type="button" style="align-self: flex-start"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>담당자에게 등록 요청</button>
    </div>
    <div class="msg-u">노트북 경비 계정과목이 뭐야?</div>
    <div class="msg-a">
      <span class="bubble" style="display: flex; align-items: center; gap: 10px"><span class="mascot s-20 is-sit" aria-hidden="true"><span class="float"><span class="cube"><i class="limb foot l"></i><i class="limb foot r"></i><i class="limb arm l"></i><i class="limb arm r"></i><span class="face"><i class="eye l"></i><i class="eye r"></i></span></span></span></span><span class="typing" aria-label="답변 중"><i></i><i style="background: #c7c7cc"></i><i style="background: #d8d8dc"></i></span></span>
    </div>
  </div>

  <footer style="background: #ffffff; border-top: 1px solid var(--border); padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 6px; overflow: hidden">
      <button class="chip" type="button">오늘 뭐 해야 해?</button>
      <button class="chip" type="button">회의실 예약 어떻게 해?</button>
      <button class="chip" type="button">노트북 경비…</button>
    </div>
    <div class="composer">
      <label for="qm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">질문 입력</label>
      <textarea id="qm" rows="1" placeholder="궁금한 걸 물어보세요"></textarea>
      <button class="send" type="button" aria-label="답변 중지" style="background: var(--foreground)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; fill: #ffffff"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
    </div>
  </footer>
</div>

</body>
</html>
