# main 푸시 → 스테이징: DB 마이그레이션 → 계정 부트스트랩 → 기본 서식 부트스트랩 → 에이전트 → 웹 → smoke.sh. 실패하면 그 자리에서 멈춘다.
# 값은 GitHub Environment "staging"의 변수·비밀값에서 받는다(docs/deploy.md). GCP는 스테이징 전용 프로젝트.
name: deploy-staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: 스테이징 배포
    runs-on: ubuntu-latest
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      AGENT_URL: ${{ vars.AGENT_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 배포 설정 확인
        run: |
          fail=0
          if grep -nE '^[^#]*REPLACE_ME' apps/web/.env.staging; then
            echo "::error::apps/web/.env.staging에 REPLACE_ME가 남아 있습니다."; fail=1
          fi
          # 이 환경의 GCP 프로젝트에 Hosting 대상 staging이 연결돼 있어야 한다(환경마다 프로젝트가 다르다)
          site="$(jq -r --arg p "$GCP_PROJECT_ID" '.targets[$p].hosting.staging[0] // empty' .firebaserc)"
          if [ -z "$site" ] || [[ "$site" == *REPLACE_ME* ]]; then
            echo "::error::.firebaserc에 프로젝트 '$GCP_PROJECT_ID'의 Hosting 대상 staging이 없습니다."; fail=1
          fi
          for v in GCP_PROJECT_ID SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_ANON_KEY AGENT_URL WEB_URL; do
            [ -n "${!v}" ] || { echo "::error::GitHub 변수 $v가 비어 있습니다."; fail=1; }
          done
          file_value() { sed -n "s/^$1=//p" apps/web/.env.staging; }
          [ "$(file_value VITE_SUPABASE_URL)" = "$SUPABASE_URL" ] || { echo "::error::.env.staging의 VITE_SUPABASE_URL이 변수 SUPABASE_URL과 다릅니다."; fail=1; }
          [ "$(file_value VITE_AGENT_URL)" = "$AGENT_URL" ] || { echo "::error::.env.staging의 VITE_AGENT_URL이 변수 AGENT_URL과 다릅니다."; fail=1; }
          exit "$fail"

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: DB 마이그레이션
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - name: 계정 부트스트랩
        working-directory: services/agent
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@demo.test' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python scripts/bootstrap_accounts.py

      - name: 기본 서식 부트스트랩
        working-directory: services/agent
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run --no-sync python scripts/bootstrap_forms.py

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: 에이전트 배포 (agent-staging)
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ALLOWED_ORIGIN_REGEX: ${{ vars.ALLOWED_ORIGIN_REGEX }}
          # (선택) 테스트 기간에 하루 한도를 올릴 때만 둔다. 없으면 서비스 기본값
          CHAT_DAILY_LIMIT: ${{ vars.CHAT_DAILY_LIMIT }}
          EXAM_DAILY_LIMIT: ${{ vars.EXAM_DAILY_LIMIT }}
        run: bash scripts/deploy-agent.sh staging "$GITHUB_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 웹 빌드 (mode staging)
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build -- --mode staging
      - name: 웹 배포 (hosting:staging)
        run: |
          npx --yes firebase-tools@15.36.0 deploy --only hosting:staging \
            --project "$GCP_PROJECT_ID" -m "staging $GITHUB_SHA" --non-interactive

      - name: 배포 점검 (smoke.sh)
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          EXPECT_VERSION="$GITHUB_SHA" \
            bash scripts/smoke.sh "$WEB_URL" "$AGENT_URL" "$SUPABASE_URL" "$SUPABASE_ANON_KEY"
