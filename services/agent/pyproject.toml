[project]
name = "onboarding-agent"
version = "0.1.0"
description = "온보딩 에이전트 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator==2.3.0",
    "fastapi>=0.163.1",
    "google-adk==2.13.0",
    "litellm==1.105.7",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
